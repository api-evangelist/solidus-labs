                          type: string
                          example: '0x953e5cb1e053b3158166935aff287ffc7cf5984c'
                        name:
                          type: string
                          example: AIBRAIN
                        symbol:
                          type: string
                          example: AIBRAIN
                        chain_id:
                          type: string
                          example: '56'
                        rugpulls:
