                        pair_address:
                          type: string
                          example: '0xc444deabb42cd9da642f7aa106fbb7f88b3e58ae'
                        created_at:
                          type: string
                          example: '2025-04-04T21:06:03.000Z'
                        is_rugpull:
                          type: boolean
                          example: true
                          default: true
                        tokens:
                          type: array
                          items:
                            type: object
                            properties:
                              address:
                                type: string
                                example: '0x953e5cb1e053b3158166935aff287ffc7cf5984c'
                              name:
                                type: string
                                example: AIBRAIN
                              symbol:
                                type: string
                                example: AIBRAIN
                        rugpulls:
                          type: array
                          items:
                            type: object
                            properties:
                              category:
                                type: string
