      x-source-doc: https://tokensniffer.readme.io/reference/list-malicious-pairs
  /scams/tokens:
    get:
      summary: List Tokens with Malicious Pairs
      description: Get the tokens (excluding the quote token such as ETH, BNB, etc) for trading pairs which have been rugpulled
        in the last 24 hours.  Available with the Enterprise plan.
      operationId: list-tokens-with-malicious-pairs
      parameters:
      - name: chain_id
        in: query
        description: Chain identifier
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of results.  Defaults to 100 with a maximum of 5000.
        schema:
          type: integer
          format: int32
          default: 100
      - name: offset
        in: query
        description: Number of results to skip.  Defaults to 0.
        schema:
          type: integer
          format: int32
          default: 0
      - name: start_time
        in: query
        description: Restrict results to tokens created after this time
        schema:
          type: string
      - name: end_time
        in: query
        description: Restrict results to tokens created before this time
        schema:
          type: string
      - name: X-API-Key
        in: header
        description: Your assigned API key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"message\": \"OK\",\n  \"total\": 1357,\n  \"result\": [\n    {\n      \"address\": \"0x953e5cb1e053b3158166935aff287ffc7cf5984c\"\
                    ,\n      \"name\": \"AIBRAIN\",\n      \"symbol\": \"AIBRAIN\",\n      \"chain_id\": \"56\",\n      \"\
                    rugpulls\": [\n        {\n          \"category\": \"swap\",\n          \"timestamp\": \"2025-04-04T21:06:06.000Z\"\
                    ,\n          \"tx_hash\": \"0x3e7a79a5fe81499236f3dc8337004d68fcc5cc38cb2177ae481c0f9839ca0a08\"\n   \
                    \     }\n      ]\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: OK
                  total:
                    type: integer
                    example: 1357
                    default: 0
                  result:
                    type: array
                    items:
                      type: object
                      properties:
