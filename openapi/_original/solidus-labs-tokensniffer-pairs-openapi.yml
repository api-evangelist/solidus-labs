                    ,\n      \"factory_address\": \"0xca143ce32fe78f1f7019d7d551a6402fc5350c73\",\n      \"pair_address\"\
                    : \"0xc444deabb42cd9da642f7aa106fbb7f88b3e58ae\",\n      \"created_at\": \"2025-04-04T21:06:03.000Z\"\
                    ,\n      \"is_rugpull\": true,\n      \"tokens\": [\n        {\n          \"address\": \"0x953e5cb1e053b3158166935aff287ffc7cf5984c\"\
                    ,\n          \"name\": \"AIBRAIN\",\n          \"symbol\": \"AIBRAIN\"\n        },\n        {\n      \
                    \    \"address\": \"0xbb4cdb9cbd36b01bd1cbaebf2de08d9173bc095c\",\n          \"name\": \"Wrapped BNB\"\
                    ,\n          \"symbol\": \"WBNB\"\n        }\n      ],\n      \"rugpulls\": [\n        {\n          \"\
                    category\": \"swap\",\n          \"timestamp\": \"2025-04-04T21:06:06.000Z\",\n          \"tx_hash\":\
                    \ \"0x3e7a79a5fe81499236f3dc8337004d68fcc5cc38cb2177ae481c0f9839ca0a08\"\n        }\n      ]\n    }\n\
                    \   ]\n}"
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: OK
                  total:
                    type: integer
                    example: 1452
                    default: 0
                  result:
                    type: array
                    items:
                      type: object
                      properties:
