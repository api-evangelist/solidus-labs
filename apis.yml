aid: solidus-labs
name: Solidus Labs
description: >-
  Solidus Labs is a crypto-native market-integrity and compliance technology company founded in 2018 by former
  Goldman Sachs engineers, headquartered in New York with offices in Tel Aviv and London. Its HALO platform is a
  unified compliance control hub spanning eight modules — Trade Surveillance, Transaction Monitoring, Stablecoin
  Monitoring, Token Monitoring, Execution Quality, Case Management, Agentic-AI Workflows and Professional Services —
  used by regulated exchanges, broker-dealers, market makers, custodians, OTC desks, stablecoin issuers and
  regulators across digital assets, derivatives, equities and fixed income. The publicly documented developer
  surface is the TokenSniffer API, the programmatic face of Solidus Labs' Token Monitoring module: a key-authenticated
  REST API over smart-contract scam detection, the TokenSniffer "Smell Test" risk score, malicious token/pair/address
  feeds across 15+ chains, and a v3 webhook subscription API for real-time scam and rug-pull notifications. The HALO
  platform itself is delivered to contracted customers through regional dashboards and is not publicly documented.
