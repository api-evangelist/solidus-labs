apis:
- name: TokenSniffer API
  description: >-
    The public REST API behind TokenSniffer, the token-security platform that powers Solidus Labs' HALO Token
    Monitoring module. Analyzes token contract source code and bytecode against a database of 10,000+ scam code
    patterns, returning token metadata, on-chain metrics (holders, liquidity, swap simulation, permissions) and
    Smell Test results including a 0-100 token score and scam status. Enterprise tiers add 24-hour feeds of latest
    and malicious tokens, trading pairs and deployer addresses, plus a v3 webhook subscription API for push
    notifications on token creation, malicious flagging, liquidity creation and rug pulls. Authenticated with an
    apikey query parameter; 5 requests/second; 500 (Pro) to 5,000+ (Enterprise) unique token lookups per day.
  humanURL: https://tokensniffer.readme.io/
  baseURL: https://tokensniffer.com/api/v2
